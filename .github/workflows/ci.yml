# CI Pipeline for Bifrost
# Runs build, lint, typecheck, and tests on all pushes and pull requests
# For a full CI/CD pipeline with deployment, see ci-cd.yml.example

name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-format-typecheck-and-test:
    name: Gitleaks & Lint-Format-Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Global [[allowlists]] requires a newer scanner than the action default.
          GITLEAKS_VERSION: '8.30.1'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm -C shared build

      - name: Lint
        run: pnpm run redaction:check && pnpm run lint

      - name: Lint admin
        run: pnpm -C admin run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type check
        run: |
          pnpm run typecheck
          pnpm run -r typecheck

      - name: Test
        run: |
          pnpm run test
          pnpm run -r test

      - name: Coverage regression gates
        run: pnpm run test:coverage:all

      - name: Public sanitization gate
        run: pnpm run public:check

      - name: Script regression gates
        run: pnpm run test:gates

      # Runtime-types freshness gate: `wrangler types --check` asserts the committed
      # worker-configuration.d.ts still matches each Worker's wrangler.toml
      # (compatibility_date + flags). A compat-date bump or binding change that is not
      # regenerated fails HERE rather than silently typechecking against a stale runtime
      # surface. Listed explicitly because this job enumerates commands inline and does
      # NOT invoke `pnpm run check`.
      - name: Generated changelog freshness gate
        # The Worker serves src/generated/changelog-text.ts, so a CHANGELOG.md
        # edit without `pnpm run changelog:generate` ships a stale document.
        # Must be listed here as well as in `check` — this job enumerates its
        # commands inline and does NOT invoke `check`.
        run: pnpm run changelog:check

      - name: Runtime types check (root)
        run: pnpm run types:check

      - name: Runtime types check (slackbot)
        run: pnpm -C slackbot run types:check

      - name: Build admin dashboard
        run: pnpm -C admin build

      - name: Changelog-not-bundled gate
        # The built dashboard assets are served with no credential check, so a
        # `?raw` re-import of CHANGELOG.md republishes every release note.
        # Runs against the freshly built admin/dist, immediately after the build.
        run: pnpm run check:changelog-bundle

      - name: Changelog chunk ceiling
        run: pnpm run check:changelog-chunk

      - name: Analytics performance gate
        run: pnpm run benchmark:analytics

      - name: Routing performance gate
        run: pnpm run benchmark:routing:gate

      - name: Unified analytics dormant-path gate
        run: pnpm run benchmark:unified-disabled

      - name: Production and development Wrangler dry-runs
        run: pnpm run wrangler:check
