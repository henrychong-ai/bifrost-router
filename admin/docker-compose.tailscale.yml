# Production compose file with Tailscale integration
# Provides: https://bifrost.your-tailnet.ts.net
#
# Prerequisites:
# 1. Generate Tailscale auth key at https://login.tailscale.com/admin/settings/keys
#    - Reusable: Yes
#    - Tags: tag:server (or appropriate tag)
# 2. Create auth.env file with TAILSCALE_AUTHKEY=tskey-auth-xxx,
#    API_PROXY_ORIGIN=https://bifrost.example.com
#    (the Worker the dashboard's /api proxy reaches) and
#    ADMIN_API_KEY=<your admin API key> (read at
#    container start into a root-only nginx include; never baked into the
#    image, never sent to the browser). Optional: CSP_MODE=report-only,
#    CSP_REPORT_ORIGIN=https://bifrost.your-tailnet.ts.net (CSP violation
#    reports), R2_PREVIEW_ORIGINS=https://files.example.com and
#    API_PROXY_RESOLVER (IPv4 DNS resolvers, default 1.1.1.1 1.0.0.1).
#
# Deploy:
#   docker compose -f docker-compose.tailscale.yml pull
#   docker compose -f docker-compose.tailscale.yml up -d

services:
  admin:
    image: ghcr.io/your-username/bifrost-dashboard:tailscale
    container_name: bifrost-dashboard
    restart: unless-stopped
    env_file:
      - auth.env
    environment:
      - TAILSCALE_HOSTNAME=bifrost
    volumes:
      # Persistent Tailscale state (survives container restarts)
      - ./tailscale:/var/lib/tailscale
    # Required for Tailscale userspace networking
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      # nginx listens on a Unix socket only (v1.39.0; Tailscale Serve is the
      # one way in). The TCP branch serves an image from before it, so a
      # rollback to an earlier release tag with this file stays healthy.
      test: ["CMD-SHELL", "if [ -S /run/bifrost/nginx.sock ]; then curl -fsS -o /dev/null --unix-socket /run/bifrost/nginx.sock http://localhost/health; else curl -fsS -o /dev/null http://127.0.0.1:3001/health; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: "0.5"
